<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The HD Lab</title>
<style>
/* Force pure black immediately */
html, body { background: #000 !important; margin: 0; padding: 0; height: 100%; overflow: hidden; }

:root{--bg:#000;--ac:#fff;--tx:#fff;--pn:#050505;--gb:#1a73e8;--cb:#ffffff;--ct:#202124;--cg:#e0e0e0;--ch:#f1f3f4;--cm:#70757a;--cn:#ea4335;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{color:var(--tx);font:14px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;}

/* Keyframes for HD Lab Entry */
@keyframes fadeUp{from{opacity:0;transform:translateY(3vmin)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes drift{0%{transform:translate(0,0)}33%{transform:translate(1vmin,-1vmin)}66%{transform:translate(-1vmin,1vmin)}100%{transform:translate(0,0)}}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}
@keyframes drawShape{from{stroke-dashoffset:var(--len,2000)}to{stroke-dashoffset:0}}

/* Home / Landing Page (Isolates the flash) */
#home{
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2vmin;
  overflow-y: auto;
}

.title-wrap{text-align:center;margin-bottom:3vmin;animation:fadeUp 1s cubic-bezier(.19,1,.22,1) both;animation-delay:.2s;position:relative;z-index:2}
.title-pre{font-size:clamp(9px,1.3vmin,13px);letter-spacing:.55em;text-transform:uppercase;opacity:.6;margin-bottom:1.5vmin;animation:fadeIn 1.2s ease-out both;animation-delay:.5s}
.title{font-size:clamp(40px,8vmin,92px);font-weight:200;letter-spacing:.1em;text-transform:uppercase;line-height:1;animation:fadeUp 1.2s cubic-bezier(.19,1,.22,1) both;animation-delay:.35s;white-space:nowrap;margin-bottom:2vmin;color:#fff;}
.title b{font-weight:600;letter-spacing:.04em}
.quote{font-size:clamp(11px,1.4vmin,15px);font-weight:300;letter-spacing:.12em;font-style:italic;opacity:.7;animation:fadeIn 1.5s ease-out both;animation-delay:1.2s;max-width:400px;margin:0 auto;line-height:1.5}

.ring-stage{position:relative;width:min(82vmin, 680px);height:min(82vmin, 680px);animation:scaleIn 1.5s cubic-bezier(.19,1,.22,1) both;animation-delay:.8s;flex-shrink:0;border-radius:50%;box-shadow:inset 0 0 8vmin rgba(255,255,255,.02);overflow:hidden;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px);background-size:100% 4px}
.ring-stage svg{width:100%;height:100%;overflow:visible;display:block;position:relative;z-index:2}
.ring-shape{fill:rgba(10,10,10,0.6);stroke:#fff;stroke-width:0.5vmin;stroke-linejoin:round;transition:fill .3s, stroke-width .3s, filter .3s, opacity .3s;backdrop-filter:blur(4px)}
.shape-left{stroke-dasharray:var(--len,2000);animation:drawShape 2s cubic-bezier(.19,1,.22,1) both;animation-delay:1s}
.shape-right{stroke-dasharray:var(--len,2000);animation:drawShape 2s cubic-bezier(.19,1,.22,1) both;animation-delay:1.15s}

.half-zone{position:absolute;top:0;bottom:0;width:50%;cursor:pointer;z-index:5}
.half-zone.left{left:0;border-radius:50% 0 0 50%}
.half-zone.right{right:0;border-radius:0 50% 50% 0}

.ring-stage.hover-left .shape-left{fill:rgba(255,255,255,0.06);stroke-width:0.8vmin;filter:drop-shadow(0 0 1vmin rgba(255,255,255,.3))}
.ring-stage.hover-left .shape-right{opacity:.25}
.ring-stage.hover-right .shape-right{fill:rgba(255,255,255,0.06);stroke-width:0.8vmin;filter:drop-shadow(0 0 1vmin rgba(255,255,255,.3))}
.ring-stage.hover-right .shape-left{opacity:.25}

.content-panel{position:absolute;top:0;bottom:0;width:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10%;transition:opacity .4s, transform .4s;pointer-events:none;z-index:3}
.content-panel.left{left:0}
.content-panel.right{right:0}
.ring-stage.hover-left .content-panel.right{opacity:.1;transform:scale(.95)}
.ring-stage.hover-right .content-panel.left{opacity:.1;transform:scale(.95)}

.sub-label{font-size:clamp(12px,1.8vmin,22px);letter-spacing:.45em;text-transform:uppercase;opacity:.6;margin-bottom:1.5vmin;font-weight:600;animation:fadeIn 1.5s ease-out both;animation-delay:1.6s;transition:color .3s, text-shadow .3s}
.ring-stage.hover-left .content-panel.left .sub-label{color:#fff;text-shadow:0 0 1vmin #fff}
.ring-stage.hover-right .content-panel.right .sub-label{color:#fff;text-shadow:0 0 1vmin #fff}
.desc-text{font-size:clamp(11px,1.4vmin,15px);line-height:1.6;opacity:0.3;max-width:22ch;letter-spacing:0.04em;transition:opacity .4s}
.ring-stage.hover-left .content-panel.left .desc-text,
.ring-stage.hover-right .content-panel.right .desc-text{opacity:1}

/* Mental Lab App */
#app{display:none;height:100vh;position:relative;overflow:hidden;background:#000}
#app.active{display:block;animation:fadeIn .5s ease}

/* Overrides for Mental Lab to HD Lab */
aside{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;width:158px;background:var(--pn);border-right:1px solid rgba(255,255,255,.1);padding:14px 8px;display:flex;flex-direction:column;gap:4px;z-index:5;overflow:auto}
aside b{font-size:13px;letter-spacing:.12em;color:var(--ac);padding:0 8px 10px}
aside button{display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--tx);font:inherit;padding:10px 8px;border-radius:10px;cursor:pointer;text-align:left;opacity:.7}
aside button.on{background:rgba(255,255,255,.15);color:var(--ac);opacity:1;font-weight:600}

main{
  margin-left:158px;
  padding:18px 18px 40px;
  max-width:1000px;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
}
@media(max-width:700px){aside{width:62px;padding:10px 4px}aside b{display:none}aside button{flex-direction:column;gap:2px;font-size:9px;text-align:center;padding:8px 2px}main{margin-left:62px;padding:12px 10px 40px}}
h1{margin:0;font-size:20px;font-weight:600}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:0 0 8px}
.sub{opacity:.6;font-size:12px}
.pn{background:var(--pn);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(255,255,255,.02)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pts{background:var(--ac);color:var(--bg);padding:4px 12px;border-radius:99px;font-weight:600}
button.b,select,input,textarea{font:inherit;background:var(--pn);color:var(--tx);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 9px}
button.b{cursor:pointer;color:var(--ac);border-color:var(--ac)}
button.b:hover,button.b.on{background:var(--ac);color:var(--bg)}
button.x{color:#d64550;border-color:#d64550}
button.x:hover{background:#d64550;color:#fff}
input[type=color]{padding:0;height:30px;width:48px}
.bar{height:5px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
.row .f{flex:1;min-width:120px}
.gr{font-weight:700;color:var(--ac);min-width:30px}
.done{opacity:.4;text-decoration:line-through}
.card{border:2px solid var(--ac)}
.card.r1{border-color:#e0b020}.card.r2{border-color:#9b6bd8}.card.r3{border-color:#3a9ad9}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
tr.cl{cursor:pointer}tr.cl:hover,tr.me{background:rgba(255,255,255,.1)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal>div{max-width:440px;width:100%;max-height:85vh;overflow:auto;margin:0}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:20;display:none;font-weight:bold}
.tag{font-size:11px;border:1px solid var(--ac);border-radius:6px;padding:1px 6px;color:var(--ac);display:inline-block;margin:1px}
.tag.warn{border-color:#d64550;color:#d64550}
.room{filter:grayscale(1)}
.warnbox{border-color:#d64550;background:rgba(214,69,80,.1)}
.gc{background:var(--cb);color:var(--ct);border:1px solid var(--cg);border-radius:16px;overflow:hidden;margin:10px 0}
.gc select,.gc input:not([type=checkbox]),.gc button{color:var(--ct);background:var(--cb);border-color:var(--cg)}
.cbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--cg);flex-wrap:wrap}
.cbar input{border-radius:99px;background:var(--ch)!important;border:0;padding:8px 14px;flex:1;min-width:110px;max-width:260px}
.cbar .b:hover{background:var(--ch);color:var(--ct)}
.cbar .pri{background:var(--gb)!important;color:#fff!important;border-color:var(--gb)}
.gbody{display:flex}
.csb{width:220px;padding:10px;border-right:1px solid var(--cg);flex-shrink:0;font-size:13px}
.cmain{flex:1;min-width:0}
@media(max-width:700px){.gbody{flex-direction:column}.csb{width:auto;border-right:0;border-bottom:1px solid var(--cg)}}
.tg{display:flex;flex-direction:column}.gr1{display:grid}
.dh{text-align:center;padding:6px 0;font-size:11px;color:var(--cm);cursor:pointer;text-transform:uppercase}
.dh b{display:block;font-size:22px;font-weight:400;color:var(--ct);text-transform:none}
.dh.td{color:var(--gb)}.dh.td b{background:var(--gb);color:#fff;border-radius:99px;width:38px;height:38px;line-height:38px;margin:2px auto}
.adc{border-left:1px solid var(--cg);padding:1px;min-height:22px;min-width:0}
.gs{max-height:560px;overflow-y:auto;position:relative;border-top:1px solid var(--cg)}
.hrs{position:relative}
.hl{position:absolute;right:6px;font-size:10px;color:var(--cm);transform:translateY(-6px)}
.col{position:relative;border-left:1px solid var(--cg);background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--cg) 47px,var(--cg) 48px);user-select:none}
.ev{position:absolute;border-radius:6px;color:#fff;font-size:11px;padding:2px 5px;overflow:hidden;cursor:pointer;border:1px solid var(--cb);touch-action:pan-y;line-height:1.25}
.ev b{display:block;font-weight:500;font-size:12px}
.rz{position:absolute;left:0;right:0;height:6px;cursor:ns-resize}.rz.t{top:0}.rz.b{bottom:0}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--cn);z-index:3;pointer-events:none}
.nowl i{position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:9px;background:var(--cn)}
.pl{border-radius:5px;color:#fff;font-size:11px;padding:1px 6px;margin:1px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--cm);padding:6px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc{min-height:96px;border-top:1px solid var(--cg);border-left:1px solid var(--cg);padding:2px;cursor:pointer;overflow:hidden}
.mc.om{background:var(--ch)}
.mn{display:inline-block;font-size:12px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:99px}
.mn.td{background:var(--gb);color:#fff}
.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;gap:1px}
.mg i{font-style:normal;padding:4px 0;cursor:pointer;border-radius:99px;position:relative}
.mg i.mh{color:var(--cm);cursor:default}.mg i.td{background:var(--gb);color:#fff}
.mg i.sd{background:rgba(255,255,255,.1);color:var(--gb)}
.mg u{position:absolute;bottom:0;left:calc(50% - 2px);width:4px;height:4px;border-radius:9px;background:var(--cm)}
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:12px}
.yc>b{cursor:pointer;display:block;margin-bottom:4px}
.ag{padding:8px 14px}.ag h3{font-size:13px;margin:12px 0 4px;color:var(--ct)}
.ar{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #eee;cursor:pointer}
.ar i{width:10px;height:10px;border-radius:9px;flex-shrink:0}
.cr{display:flex;align-items:center;gap:6px;padding:3px 0}
.cr .dot{width:10px;height:10px;border-radius:9px}
.cr .cn{border:0!important;flex:1;min-width:0;padding:2px}
.cr .cc{width:22px!important;height:22px!important;border:0}
#ctx{position:fixed;z-index:30;background:var(--cb);color:var(--ct);border:1px solid var(--cg);border-radius:8px;box-shadow:0 4px 16px #0003;padding:4px 0;display:none}
#ctx div{padding:7px 18px;cursor:pointer;font-size:13px}
#ctx div:hover{background:var(--ch)}
.sw{display:inline-block;width:22px;height:22px;border-radius:99px;cursor:pointer;border:3px solid transparent;margin:2px}
.exam-q{background:rgba(255,255,255,.05);border-left:3px solid var(--ac);padding:10px 12px;margin:10px 0;border-radius:6px}
.exam-q p{margin:0 0 8px;font-weight:600}
.exam-opts{display:flex;flex-direction:column;gap:6px}
.exam-opts label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid rgba(255,255,255,.1)}
.exam-opts label:hover{background:rgba(255,255,255,.05)}
.exam-opts input[type=radio]{accent-color:var(--ac)}
.phase-badge{background:linear-gradient(135deg,var(--ac),rgba(255,255,255,.5));color:#000;padding:3px 10px;border-radius:99px;font-weight:600;font-size:11px;letter-spacing:.05em}
.proj{border-left:4px solid var(--ac);padding-left:12px;margin:12px 0}
.proj h3{margin:0 0 4px;font-size:15px}
.sess-grid{display:flex;gap:3px;margin:6px 0}
.sess-grid div{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.1)}
.sess-grid div.on{background:var(--ac)}
.today-card{border-left:4px solid var(--ac)}
.phase-card{border-left:4px solid #e0b020;background:linear-gradient(90deg,rgba(224,176,32,.1),var(--pn))}
.tutorial-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.tutorial-box{background:var(--pn);border:2px solid var(--ac);border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(255,255,255,.05)}
.tutorial-box h2{font-size:16px;letter-spacing:.08em;margin:0 0 12px}
.tutorial-box p{line-height:1.6}
.tutorial-dots{display:flex;gap:6px;margin:16px 0;justify-content:center}
.tutorial-dots span{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.2)}
.tutorial-dots span.on{background:var(--ac);width:24px}
.month-snap{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px}
.cmp-row{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.cmp-bar{height:6px;background:rgba(255,255,255,.1);border-radius:9px;position:relative;overflow:hidden}
.cmp-bar i{position:absolute;top:0;height:100%;border-radius:9px}
.degree-card{background:linear-gradient(135deg,#1a1a1a,#000);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:16px;padding:20px;margin:10px 0;box-shadow:0 4px 20px rgba(255,255,255,.05)}
.degree-card h2{color:#fff;opacity:.85;margin:0 0 6px}
.degree-num{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.degree-sub{opacity:.85;font-size:13px;margin-top:4px}
.degree-bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:12px;overflow:hidden}
.degree-bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.degree-two{display:flex;gap:20px;align-items:flex-end;margin-top:4px;flex-wrap:wrap}
.degree-num-sm{font-size:22px;font-weight:700;letter-spacing:-.01em}
.module-card{border-left:4px solid var(--ac)}
.module-card.locked{opacity:.5;border-left-color:#999}
.assess-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.assess-row .name{flex:1;min-width:120px}
.assess-row .weight{font-size:12px;opacity:.7;min-width:50px;text-align:right}
.assess-row .score{width:70px;text-align:center;font-weight:600}
.assess-row .score.done{color:var(--ac)}
.assess-row .status{font-size:11px;min-width:70px;text-align:right;opacity:.7}
.assess-group{background:rgba(255,255,255,.03);border-radius:8px;padding:8px 12px;margin:6px 0}
.assess-group-head{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.assess-group-head .name{flex:1}
.assess-group-body{margin-top:6px;padding-left:16px}
.assess-group-body.collapsed{display:none}
.assess-group-body .assess-row{padding:6px 0}
.warn-text{color:#d64550;font-size:12px;margin-top:4px}

/* Splash */
.splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:fadeIn .4s ease-out both;cursor:pointer}
.splash.gone{animation:fadeOut .7s ease-in forwards}
.splash-title{font-size:clamp(14px,1.8vmin,18px);font-weight:200;letter-spacing:.6em;text-transform:uppercase;opacity:.65;margin-bottom:3vmin;text-align:center}
.splash-bar{width:14vmin;max-width:140px;height:1px;background:#fff;transform:scaleX(0);transform-origin:left;animation:loadBar 1.3s ease-out both;animation-delay:.2s}
@keyframes loadBar{to{transform:scaleX(1)}}
.splash-hint{font-size:clamp(9px,1.1vmin,11px);letter-spacing:.45em;text-transform:uppercase;opacity:.28;margin-top:3vmin;animation:pulse 2s infinite}

/* Ambient */
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.12;z-index:0}
.ambient span{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:drift 18s infinite ease-in-out}
.corner{position:fixed;width:2.5vmin;height:2.5vmin;pointer-events:none;opacity:.3;animation:fadeIn 1.5s ease-out both;animation-delay:1s;z-index:10}
.corner.tl{top:2vmin;left:2vmin;border-top:1px solid #fff;border-left:1px solid #fff}
.corner.tr{top:2vmin;right:2vmin;border-top:1px solid #fff;border-right:1px solid #fff}
.corner.bl{bottom:2vmin;left:2vmin;border-bottom:1px solid #fff;border-left:1px solid #fff}
.corner.br{bottom:2vmin;right:2vmin;border-bottom:1px solid #fff;border-right:1px solid #fff}
</style>
</head>
<body>

<div class="splash" id="splash" onclick="enter()">
  <div class="splash-title">The HD Lab</div>
  <div class="splash-bar"></div>
  <div class="splash-hint">Tap to enter</div>
</div>

<div class="ambient" id="ambient"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div id="home">
  <div class="title-wrap">
    <div class="title-pre">Human Development Laboratory</div>
    <div class="title">The <b>HD</b> Lab</div>
    <div class="quote">"You are the only variable in your life that refuses to stay constant."</div>
  </div>

  <div class="ring-stage" id="ringStage">
    <svg viewBox="0 0 540 540" id="ringSvg">
      <path id="shapeL" class="ring-shape shape-left" d="" />
      <path id="shapeR" class="ring-shape shape-right" d="" />
    </svg>
    <div class="content-panel left" onclick="openApp()">
      <div class="sub-label">Subject</div>
      <div class="desc-text">Your private system.<br>Goals, modules, habits, projects.</div>
    </div>
    <div class="content-panel right" onclick="alert('Academy coming soon')">
      <div class="sub-label">Academy</div>
      <div class="desc-text">The competitive half.<br>Ranking, exams, the 99.</div>
    </div>
    <div class="half-zone left" onclick="openApp()" onmouseenter="hoverLeft(true)" onmouseleave="hoverLeft(false)"></div>
    <div class="half-zone right" onclick="alert('Academy coming soon')" onmouseenter="hoverRight(true)" onmouseleave="hoverRight(false)"></div>
  </div>
</div>

<div id="app"></div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div class="pn card" id="mb"></div></div>
<div id="toast"></div>
<div id="ctx"></div>
<div id="tutorial"></div>

<script>
// ═══════════════════════════════════════════════════════

  home.style.display = 'none';
  app.classList.add('active');
  // The Mental Lab renders itself on load, but just in case, force a render
  if (typeof render === 'function') render();
}

function enter(){
  const sp = $('splash');
  if(!sp || sp.classList.contains('gone')) return;
  sp.classList.add('gone');
  setTimeout(() => { sp.style.display = 'none'; }, 700);
}

function hoverLeft(on){
  const st = $('ringStage');
  if(on) st.classList.add('hover-left');
  else st.classList.remove('hover-left');
}
function hoverRight(on){
  const st = $('ringStage');
  if(on) st.classList.add('hover-right');
  else st.classList.remove('hover-right');
}

// Generates the perfect split circle shape
(function buildShapes() {
  const R = 240, cx = 270, cy = 270;
  const pathL = `M ${cx} ${cy - R} A ${R} ${R} 0 0 0 ${cx} ${cy + R} Z`;
  const pathR = `M ${cx} ${cy - R} A ${R} ${R} 0 0 1 ${cx} ${cy + R} Z`;
  $('shapeL').setAttribute('d', pathL);
  $('shapeR').setAttribute('d', pathR);
  $('shapeL').style.setProperty('--len', $('shapeL').getTotalLength());
  $('shapeR').style.setProperty('--len', $('shapeR').getTotalLength());
})();

// Ambient particles
(function spawnAmbient(){
  const wrap = $('ambient');
  if(!wrap) return;
  for(let i=0;i<18;i++){
    const s = document.createElement('span');
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.animationDelay = (Math.random()*-18)+'s';
    s.style.animationDuration = (12+Math.random()*12)+'s';
    wrap.appendChild(s);
  }
})();
</script>
</body>
