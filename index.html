<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Calendar</title>
<style>
:root{--bg:#f4f6f2;--ac:#1f9d55;--tx:#1d2a22;--pn:#ffffff;--gb:#1a73e8;--cb:#ffffff;--ct:#202124;--cg:#e0e0e0;--ch:#f1f3f4;--cm:#70757a;--cn:#ea4335;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
aside{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;width:158px;background:var(--pn);border-right:1px solid color-mix(in srgb,var(--tx) 12%,transparent);padding:14px 8px;display:flex;flex-direction:column;gap:4px;z-index:5;overflow:auto}
aside b{font-size:13px;letter-spacing:.12em;color:var(--ac);padding:0 8px 10px}
aside button{display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--tx);font:inherit;padding:10px 8px;border-radius:10px;cursor:pointer;text-align:left;opacity:.7}
aside button.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);opacity:1;font-weight:600}
main{margin-left:158px;padding:18px 18px 40px;max-width:1000px}
@media(max-width:700px){aside{width:62px;padding:10px 4px}aside b{display:none}aside button{flex-direction:column;gap:2px;font-size:9px;text-align:center;padding:8px 2px}main{margin-left:62px;padding:12px 10px 40px}}
h1{margin:0;font-size:20px;font-weight:600}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:0 0 8px}
.sub{opacity:.6;font-size:12px}
.pn{background:var(--pn);border:1px solid color-mix(in srgb,var(--tx) 11%,transparent);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0000000a}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
button.b,select,input,textarea{font:inherit;background:var(--pn);color:var(--tx);border:1px solid color-mix(in srgb,var(--tx) 22%,transparent);border-radius:8px;padding:6px 9px}
button.b{cursor:pointer;color:var(--ac);border-color:var(--ac)}
button.b:hover,button.b.on{background:var(--ac);color:#fff}
button.x{color:#d64550;border-color:#d64550}
button.x:hover{background:#d64550}
input[type=color]{padding:0;height:30px;width:48px}
.bar{height:5px;background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--tx) 8%,transparent);flex-wrap:wrap}
.row .f{flex:1;min-width:120px}
.done{opacity:.4;text-decoration:line-through}
.card{border:2px solid var(--ac)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal>div{max-width:440px;width:100%;max-height:85vh;overflow:auto;margin:0}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:20;display:none}
.tag{font-size:11px;border:1px solid var(--ac);border-radius:6px;padding:1px 6px;color:var(--ac);display:inline-block;margin:1px}
.gc{background:var(--cb);color:var(--ct);border:1px solid var(--cg);border-radius:16px;overflow:hidden;margin:10px 0}
.gc select,.gc input:not([type=checkbox]),.gc button{color:var(--ct);background:var(--cb);border-color:var(--cg)}
.cbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--cg);flex-wrap:wrap}
.cbar input{border-radius:99px;background:var(--ch)!important;border:0;padding:8px 14px;flex:1;min-width:110px;max-width:260px}
.cbar .b:hover{background:var(--ch);color:var(--ct)}
.cbar .pri{background:var(--gb)!important;color:#fff!important;border-color:var(--gb)}
.gbody{display:flex}
.csb{width:220px;padding:10px;border-right:1px solid var(--cg);flex-shrink:0;font-size:13px}
.cmain{flex:1;min-width:0}
@media(max-width:700px){.gbody{flex-direction:column}.csb{width:auto;border-right:0;border-bottom:1px solid var(--cg)}}
.tg{display:flex;flex-direction:column}.gr1{display:grid}
.dh{text-align:center;padding:6px 0;font-size:11px;color:var(--cm);cursor:pointer;text-transform:uppercase}
.dh b{display:block;font-size:22px;font-weight:400;color:var(--ct);text-transform:none}
.dh.td{color:var(--gb)}.dh.td b{background:var(--gb);color:#fff;border-radius:99px;width:38px;height:38px;line-height:38px;margin:2px auto}
.adc{border-left:1px solid var(--cg);padding:1px;min-height:22px;min-width:0}
.gs{max-height:560px;overflow-y:auto;position:relative;border-top:1px solid var(--cg)}
.hrs{position:relative}
.hl{position:absolute;right:6px;font-size:10px;color:var(--cm);transform:translateY(-6px)}
.col{position:relative;border-left:1px solid var(--cg);background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--cg) 47px,var(--cg) 48px);user-select:none}
.ev{position:absolute;border-radius:6px;color:#fff;font-size:11px;padding:2px 5px;overflow:hidden;cursor:pointer;border:1px solid var(--cb);touch-action:pan-y;line-height:1.25}
.ev b{display:block;font-weight:500;font-size:12px}
.rz{position:absolute;left:0;right:0;height:6px;cursor:ns-resize}.rz.t{top:0}.rz.b{bottom:0}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--cn);z-index:3;pointer-events:none}
.nowl i{position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:9px;background:var(--cn)}
.pl{border-radius:5px;color:#fff;font-size:11px;padding:1px 6px;margin:1px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--cm);padding:6px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc{min-height:96px;border-top:1px solid var(--cg);border-left:1px solid var(--cg);padding:2px;cursor:pointer;overflow:hidden}
.mc.om{background:var(--ch)}
.mn{display:inline-block;font-size:12px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:99px}
.mn.td{background:var(--gb);color:#fff}
.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;gap:1px}
.mg i{font-style:normal;padding:4px 0;cursor:pointer;border-radius:99px;position:relative}
.mg i.mh{color:var(--cm);cursor:default}.mg i.td{background:var(--gb);color:#fff}
.mg i.sd{background:color-mix(in srgb,var(--gb) 14%,var(--cb));color:var(--gb)}
.mg u{position:absolute;bottom:0;left:calc(50% - 2px);width:4px;height:4px;border-radius:9px;background:var(--cm)}
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:12px}
.yc>b{cursor:pointer;display:block;margin-bottom:4px}
.ag{padding:8px 14px}.ag h3{font-size:13px;margin:12px 0 4px;color:var(--ct)}
.ar{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #eee;cursor:pointer}
.ar i{width:10px;height:10px;border-radius:9px;flex-shrink:0}
.cr{display:flex;align-items:center;gap:6px;padding:3px 0}
.cr .dot{width:10px;height:10px;border-radius:9px}
.cr .cn{border:0!important;flex:1;min-width:0;padding:2px}
.cr .cc{width:22px!important;height:22px!important;border:0}
#ctx{position:fixed;z-index:30;background:var(--cb);color:var(--ct);border:1px solid var(--cg);border-radius:8px;box-shadow:0 4px 16px #0003;padding:4px 0;display:none}
#ctx div{padding:7px 18px;cursor:pointer;font-size:13px}
#ctx div:hover{background:var(--ch)}
.sw{display:inline-block;width:22px;height:22px;border-radius:99px;cursor:pointer;border:3px solid transparent;margin:2px}
.tutorial-overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.tutorial-box{background:var(--pn);border:2px solid var(--ac);border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 60px #0004}
.tutorial-box h2{font-size:16px;letter-spacing:.08em;margin:0 0 12px}
.tutorial-box p{line-height:1.6}
.tutorial-dots{display:flex;gap:6px;margin:16px 0;justify-content:center}
.tutorial-dots span{width:8px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--ac) 30%,transparent)}
.tutorial-dots span.on{background:var(--ac);width:24px}
.month-snap{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--tx) 8%,transparent);font-size:13px}
.degree-card{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:#fff;border-radius:16px;padding:20px;margin:10px 0;box-shadow:0 4px 20px color-mix(in srgb,var(--ac) 25%,transparent)}
.degree-card h2{color:#fff;opacity:.85;margin:0 0 6px}
.degree-num{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.degree-sub{opacity:.85;font-size:13px;margin-top:4px}
.degree-bar{height:8px;background:#ffffff30;border-radius:99px;margin-top:12px;overflow:hidden}
.degree-bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.degree-two{display:flex;gap:20px;align-items:flex-end;margin-top:4px;flex-wrap:wrap}
.degree-num-sm{font-size:22px;font-weight:700;letter-spacing:-.01em}
.module-card{border-left:4px solid var(--ac)}
.module-card.locked{opacity:.5;border-left-color:#999}
.assess-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--tx) 6%,transparent);flex-wrap:wrap}
.assess-row .name{flex:1;min-width:120px}
.assess-row .weight{font-size:12px;opacity:.7;min-width:50px;text-align:right}
.assess-row .score{width:70px;text-align:center;font-weight:600}
.assess-row .score.done{color:var(--ac)}
.assess-row .status{font-size:11px;min-width:70px;text-align:right;opacity:.7}
.assess-group{background:color-mix(in srgb,var(--ac) 4%,transparent);border-radius:8px;padding:8px 12px;margin:6px 0}
.assess-group-head{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.assess-group-head .name{flex:1}
.assess-group-body{margin-top:6px;padding-left:16px}
.assess-group-body.collapsed{display:none}
.assess-group-body .assess-row{padding:6px 0}
.warn-text{color:#d64550;font-size:12px;margin-top:4px}
.streak-big{font-size:38px;font-weight:700;line-height:1;color:var(--ac)}
</style>
</head>
<body>
<div id="app">Loading…</div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div class="pn card" id="mb"></div></div>
<div id="toast"></div>
<div id="ctx"></div>
<div id="tutorial"></div>
<script>
const $=id=>document.getElementById(id),D=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),rnd=()=>Math.random(),cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
let S,tab='home',tmr,cv='week',cd=D(),cq='',csb=null,drag=null,gsT=null,edv=null;
const fired=new Set();
const LBL={home:'Calendar',profile:'Profile',modules:'Modules',analytics:'Analytics',settings:'Settings'};
const ICO={home:'📅',profile:'👤',modules:'🎓',analytics:'📈',settings:'⚙️'};
const CT0={gb:'#1a73e8',cb:'#ffffff',ct:'#202124',cg:'#e0e0e0',cn:'#ea4335'};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const wd=d=>(d+4)%7;
const dn=ms=>Math.floor((ms-new Date(ms).getTimezoneOffset()*6e4)/864e5);
const dt=d=>new Date(d*864e5);
const midn=d=>{const x=dt(d);return new Date(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()).getTime()};
const mob=()=>innerWidth<700;
const pad=n=>String(n).padStart(2,'0');
const hm=ms=>{const x=new Date(ms);return pad(x.getHours())+':'+pad(x.getMinutes())};
const ymd=d=>dt(d).toISOString().slice(0,10);
const sn15=m=>Math.round(m/15)*15;
const wsd=d=>d-((wd(d)+6)%7);
const shiftD=(ms,k)=>{const x=new Date(ms);x.setDate(x.getDate()+k);return x.getTime()};
const MN='January,February,March,April,May,June,July,August,September,October,November,December'.split(',');
const EVC=['#d50000','#e67c73','#f4511e','#f6bf26','#33b679','#0b8043','#039be5','#3f51b5','#7986cb','#8e24aa','#616161'];
const RP=['none','daily','weekly','monthly','yearly'];
const RM=[[-1,'No reminder'],[0,'At start'],[10,'10 minutes before'],[30,'30 minutes before'],[60,'1 hour before'],[1440,'1 day before']];
const LOG=(k,m)=>{S.log.push({d:D(),k,m});S.log=S.log.slice(-400)};
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800)};
const L=k=>esc(S.cfg.L[k]??LBL[k]??k);
function theme(){const r=document.documentElement.style,c=S.cfg;['bg','ac','tx','pn'].forEach(k=>r.setProperty('--'+k,c[k]));document.title=c.name;themeCal()}
function themeCal(){const r=document.documentElement.style,t=S.cfg.ct||CT0;['gb','cb','ct','cg','cn'].forEach(k=>r.setProperty('--'+k,t[k]));r.setProperty('--ch','color-mix(in srgb,'+t.ct+' 7%,'+t.cb+')');r.setProperty('--cm','color-mix(in srgb,'+t.ct+' 55%,'+t.cb+')')}
function mkCal(){const cals=[{id:'c_habit',n:'Habits',color:'#0b8043',on:1},{id:'c_task',n:'Tasks',color:'#1a73e8',on:1},{id:'c_other',n:'Personal',color:'#8e24aa',on:1}];return{cals,ev:[]}}
const DEF_ETYPES=[{id:'et_habit',n:'Habit',streak:1},{id:'et_task',n:'Task',streak:1},{id:'et_other',n:'Other',streak:0}];
function fresh(){const f={v:12,name:'Mutant',title:'Nobody',quote:"The quiet hours are the loudest.",day:D(),rt:{},rtb:{},best:0,modules:[],degreeTarget:70,hs:[],log:[],made:Date.now(),lastBackup:0,tutorialDone:0,monthSnaps:[],cfg:{name:'Mr Calendar',bg:'#f4f6f2',ac:'#1f9d55',tx:'#1d2a22',pn:'#ffffff',L:{...LBL},ct:{...CT0},etypes:DEF_ETYPES.map(e=>({...e}))}};f.cal=mkCal();return f}
function migrate(){const f=fresh();
if(S.v<12){
for(const k in f)if(S[k]===undefined)S[k]=f[k];for(const k in f.cfg)if(S.cfg[k]===undefined)S.cfg[k]=f.cfg[k];
if(!S.cfg.etypes||!S.cfg.etypes.length)S.cfg.etypes=DEF_ETYPES.map(e=>({...e}));
if(S.cal&&S.cal.ev)S.cal.ev.forEach(e=>{if(!e.etype){e.etype=e.type==='habit'?'et_habit':e.type==='mission'?'et_task':e.type==='other'?'et_other':'et_other'}});
if(S.cal&&S.cal.cals)S.cal.cals=S.cal.cals.filter(c=>['c_habit','c_task','c_other'].includes(c.id));
['attrs','goals','projects','missions','diff','heat','notes','eff','shield','boost','trials','trial','offer','scars','shop','pts','gen','room','npcs','rival','beat','phase','phaseHistory','legacy','season','exam','routine','gd'].forEach(k=>{delete S[k]});
if(S.cfg){['gen','phase','cut','sn','fl','decay','fp'].forEach(k=>{delete S.cfg[k]})}
S.v=12;LOG('system','Migrated to Mr Calendar. Stats, goals, projects, exam removed.')}
if(!S.cal)S.cal=mkCal();if(!S.cfg.etypes||!S.cfg.etypes.length)S.cfg.etypes=DEF_ETYPES.map(e=>({...e}))}
function etOf(id){return S.cfg.etypes.find(e=>e.id===id)||S.cfg.etypes[0]}
function etStreak(ev){const t=etOf(ev.etype);return t?t.streak:0}
function monthSnapshot(){const today=new Date(),dom=today.getUTCDate(),monthKey=today.getUTCFullYear()+'-'+pad(today.getUTCMonth()+1);if(dom!==1)return;if(S.monthSnaps.some(m=>m.k===monthKey))return;S.monthSnaps.push({k:monthKey,d:D(),st:streak(),best:S.best,rate:frac(D())});S.monthSnaps=S.monthSnaps.slice(-36);LOG('snapshot','Monthly snapshot recorded: '+monthKey)}
function moduleGradedAvg(m){if(!m.assessments||!m.assessments.length)return null;let earned=0,totalWeight=0;m.assessments.forEach(a=>{if(a.group){a.subs.forEach(s=>{if(s.score!=null){earned+=s.score*s.w;totalWeight+=s.w}})}else if(a.score!=null){earned+=a.score*a.w;totalWeight+=a.w}});return totalWeight>0?earned/totalWeight:null}
function modulePercentGraded(m){if(!m.assessments||!m.assessments.length)return 0;let total=0,graded=0;m.assessments.forEach(a=>{if(a.group){a.subs.forEach(s=>{total+=s.w;if(s.score!=null)graded+=s.w})}else{total+=a.w;if(a.score!=null)graded+=a.w}});return total>0?graded/total*100:0}
function moduleStatus(m){if(m.locked)return'locked';const c=moduleGradedAvg(m);if(c==null)return'none';let graded=0,total=0;m.assessments.forEach(a=>{if(a.group){a.subs.forEach(s=>{total++;if(s.score!=null)graded++})}else{total++;if(a.score!=null)graded++}});if(graded===0)return'none';if(graded<total)return'partial';return'complete'}
function degreeCurrent(){const active=S.modules.filter(m=>!m.locked);let earned=0,denom=0;active.forEach(m=>{const g=moduleGradedAvg(m);if(g!=null){earned+=g*m.credits;denom+=m.credits}});return denom>0?earned/denom:null}
function degreeCompleted(){const all=S.modules.filter(m=>!m.locked);let gradedWeight=0,totalWeight=0;all.forEach(m=>{if(!m.assessments)return;let mGraded=0,mTotal=0;m.assessments.forEach(a=>{if(a.group){a.subs.forEach(s=>{mTotal+=s.w;if(s.score!=null)mGraded+=s.w})}else{mTotal+=a.w;if(a.score!=null)mGraded+=a.w}});if(mTotal>0){gradedWeight+=mGraded*m.credits/mTotal;totalWeight+=m.credits}});return totalWeight>0?gradedWeight/totalWeight*100:0}
function step(){const t=D();S.day=t;monthSnapshot()}
function snap(){const e={d:D(),r:frac(D())},l=S.hs.at(-1);if(l&&l.d==D())S.hs[S.hs.length-1]=e;else S.hs.push(e);S.hs=S.hs.slice(-400)}
const save=()=>{snap();try{localStorage.setItem('ml',JSON.stringify(S))}catch(e){}};
const evOf=id=>S.cal.ev.find(x=>x.id==id),calOf=ev=>S.cal.cals.find(c=>c.id==ev.cal),vis=ev=>calOf(ev)?.on!==0,ecol=ev=>ev.color||calOf(ev)?.color||'#1a73e8';
function occs(a,b){const r=[];S.cal.ev.forEach(ev=>{const bd=dn(ev.s),du=ev.e-ev.s,x=dt(bd),tod=ev.ad?0:ev.s-midn(bd);
if(!ev.rep||ev.rep=='none'){if(bd>=a&&bd<=b)r.push({ev,d:bd,s:ev.s,e:ev.e});return}
for(let d=Math.max(bd,a);d<=b;d++){const y=dt(d),ok=ev.rep=='daily'||(ev.rep=='weekly'&&(ev.wk&&ev.wk.length?ev.wk.includes(wd(d)):(d-bd)%7==0))||(ev.rep=='monthly'&&y.getUTCDate()==x.getUTCDate())||(ev.rep=='yearly'&&y.getUTCDate()==x.getUTCDate()&&y.getUTCMonth()==x.getUTCMonth());if(ok&&!(ev.ex||[]).includes(d)){const s=midn(d)+tod;r.push({ev,d,s,e:s+du})}}});return r}
function splitOcc(ev,d){const n=JSON.parse(JSON.stringify(ev)),tod=ev.s-midn(dn(ev.s)),du=ev.e-ev.s;ev.ex=[...(ev.ex||[]),d];n.id='e'+Date.now()+Math.floor(rnd()*99);n.rep='none';n.wk=[];n.ex=[];n.s=ev.ad?midn(d):midn(d)+tod;n.e=n.s+du;n.done=ev.done[d]?{[d]:1}:{};S.cal.ev.push(n);return n}
function streakSlots(d){return occs(d,d).filter(o=>etStreak(o.ev))}
function frac(d){const o=streakSlots(d);return o.length?o.filter(o=>o.ev.done[d]).length/o.length:0}
function streak(){let d=D(),n=0;if(frac(d)<1)d--;while(frac(d)>=1&&n<3000){n++;d--}return n}
function markDone(id,d){const ev=evOf(id);if(!ev||d>D())return;if(ev.done[d])delete ev.done[d];else{ev.done[d]=1;if(!S.rtb[d]&&frac(d)>=1){S.rtb[d]=1;const n=streak();S.best=Math.max(S.best,n);LOG('routine','Day complete. Streak '+n+'.');toast('Day complete. Streak '+n)}}
$('modal').style.display='none';save();drawCal();if(tab=='profile'||tab=='analytics')render()}
function chart(ser,h=120){const n=Math.max(...ser.map(s=>s.d.length));if(n<2)return'<div class="sub">Not enough data yet.</div>';const W=300;return`<svg viewBox="0 0 ${W} ${h}" width="100%" style="background:color-mix(in srgb,var(--tx) 4%,transparent);border-radius:10px">${ser.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.d.map((v,i)=>[(i*W/(n-1)).toFixed(1),(h-4-cl(v,0,100)/100*(h-8)).toFixed(1)].join(',')).join(' ')}"/>`).join('')}</svg>`}
function up(p,v,num){const k=p.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]);o[k.at(-1)]=num?+v:v;theme();save();render()}
const inp=(p,v,num,w)=>`<input value="${esc(v)}" ${num?'type="number"':''} style="width:${w||'100%'}" onchange="up('${p}',this.value,${!!num})">`;

function assessRowHTML(assess, modId){const sc=assess.score;

function groupRowHTML(group, modId, expandedGroups){const expanded=expandedGroups.has(group.id);let gs=0,gw=0,done=0,total=group.subs.length;group.subs.forEach(s=>{if(s.score!=null){gs+=s.score*s.w;gw+=s.w;done++}});const cur=gw>0?(gs/gw).toFixed(1)+'%':'—';
return`<div class="assess-group"><div class="assess-group-head" onclick="toggleGroup('${group.id}')"><span>${expanded?'▾':'▸'}</span><div class="name">${esc(group.n)}</div><div class="weight">${group.w}%</div><div class="sub">${done}/${total} | ${cur}</div></div><div class="assess-group-body ${expanded?'':'collapsed'}">${group.subs.map(s=>`<div class="assess-row"><div class="name" style="padding-left:8px">${esc(s.n)}</div><div class="weight">${s.w}%</div><div class="score ${s.score!=null?'done':''}">${s.score!=null?s.score+'%':'—'}</div><button class="b" onclick="editScore('${modId}','${group.id}','${s.id}')">${s.score!=null?'Edit':'Log'}</button><button class="b x" onclick="delAssess('${modId}','${group.id}','${s.id}')">×</button></div>`).join('')}</div></div>`}

function vModules(){const deg=S.degreeTarget||70,current=degreeCurrent(),completed=degreeCompleted();

${S.modules.map(mod=>{const cur=moduleGradedAvg(mod),status=moduleStatus(mod),credit=mod.credits||20,pct=modulePercentGraded(mod);

return`<div class="pn module-card ${mod.locked?'locked':''}"><div class="hd"><div><h2>${esc(mod.n)}</h2><div class="sub">${esc(mod.type)} · ${credit} credits · ${pct.toFixed(0)}% graded ${stateTag}</div></div><div style="text-align:right"><b style="font-size:18px">${curStr}</b><div class="sub">target ${mod.target||70}%</div></div></div>
${mod.locked?'<div class="sub">Locked.</div>':`<div style="margin-top:8px">${mod.assessments.map(a=>a.group?groupRowHTML(a,mod.id,expandedGroups):assessRowHTML(a,mod.id)).join('')}</div>
<div class="sub" style="margin-top:8px">Total weight: ${(mod.assessments.reduce((s,a)=>s+a.w,0)).toFixed(1)}% ${Math.abs(mod.assessments.reduce((s,a)=>s+a.w,0)-100)>0.1?'<span class="warn-text">(does not sum to 100%)</span>':''}</div>
<p><button class="b" onclick="addAssessPrompt('${mod.id}')">+ Add assessment</button> <button class="b x" onclick="delModule('${mod.id}')">Delete</button></p>`}
</div>`}).join('')}

function addAssessConfirm(modId){const mod=S.modules.find(m=>m.id==modId);if(!mod)return;const n=$('na_n').value.trim();if(!n)return toast('Name required');mod.assessments.push({id:'a'+Date.now(),n,w:+$('na_w').value||10,score:null,due:$('na_d').value||null});save();$('modal').style.display='none';render();toast('Assessment added: '+n)}
function findTarget(modId,groupId,subId){const mod=S.modules.find(m=>m.id==modId);if(!mod)return null;if(groupId&&subId){const grp=mod.assessments.find(a=>a.id==groupId);return grp?grp.subs.find(s=>s.id==subId):null}if(groupId&&!subId)return mod.assessments.find(a=>a.id==groupId);if(!groupId&&subId)return mod.assessments.find(a=>a.id==subId);return null}
function editScore(modId,groupId,subId){const target=findTarget(modId,groupId,subId);if(!target){toast('Not found');return}
const mod=S.modules.find(m=>m.id==modId);let label=target.n;if(groupId){const g=mod.assessments.find(a=>a.id==groupId);if(g&&subId)label=g.n+' — '+target.n}
$('mb').innerHTML=`<h2>${esc(label)}</h2><p>Score (%):</p><div class="row"><input id="es_v" type="number" step="0.1" min="0" max="100" value="${target.score??''}" style="width:120px;font-size:20px;font-weight:600"></div><p class="sub">Leave blank to mark ungraded.</p><p><button class="b" onclick="saveScore('${modId}','${groupId||''}','${subId||''}')">Save</button> <button class="b" onclick="clearScore('${modId}','${groupId||''}','${subId||''}')">Clear</button> <button class="b" onclick="$('modal').style.display='none'">Cancel</button></p>`;$('modal').style.display='flex'}
function saveScore(modId,groupId,subId){const target=findTarget(modId,groupId,subId);if(!target)return toast('Not found');const v=$('es_v').value;const score=v===''?null:parseFloat(v);if(score!==null&&(isNaN(score)||score<0||score>100))return toast('Score 0-100');target.score=score;save();$('modal').style.display='none';render();toast(score!=null?'Logged: '+score+'%':'Cleared')}
function clearScore(modId,groupId,subId){const target=findTarget(modId,groupId,subId);if(!target)return toast('Not found');target.score=null;save();$('modal').style.display='none';render();toast('Cleared')}
function delAssess(modId,groupId,subId){const mod=S.modules.find(m=>m.id==modId);if(!mod)return;if(!confirm('Delete?'))return;
if(groupId&&subId){const grp=mod.assessments.find(a=>a.id==groupId);if(grp)grp.subs=grp.subs.filter(s=>s.id!=subId)}
else if(groupId&&!subId){mod.assessments=mod.assessments.filter(a=>a.id!=groupId)}
else if(!groupId&&subId){mod.assessments=mod.assessments.filter(a=>a.id!=subId)}
save();render();toast('Deleted')}
function vAn(){const days=Array.from({length:30},(_,i)=>D()-29+i);
const rates=days.map(d=>{const s=streakSlots(d);return s.length?s.filter(o=>o.ev.done[d]).length/s.length*100:null});
const valid=rates.filter(x=>x!=null);

return`<div class="g2"><div class="pn"><h2>Streak</h2><b class="streak-big">${streak()}</b> <span class="sub">days · best ${S.best}</span></div><div class="pn"><h2>30-day completion</h2><b class="streak-big">${valid.length?mean(valid).toFixed(0):'—'}%</b><div class="sub">avg across days with slots</div></div></div>

${S.monthSnaps.length?`<div class="pn"><h2>Monthly history</h2>${S.monthSnaps.slice().reverse().map(s=>`<div class="month-snap"><span>${esc(s.k)}</span><span class="sub">streak ${s.st} · rate ${(s.rate*100).toFixed(0)}%</span></div>`).join('')}</div>`:''}
<div class="pn"><h2>Log</h2>${S.log.slice(-15).reverse().map(l=>`<div class="sub"><span class="tag">${esc(l.k)}</span> ${esc(l.m)}</div>`).join('')||'<div class="sub">Nothing yet.</div>'}</div>`}

<div class="pn"><h2>Calendars</h2>${S.cal.cals.map((c,i)=>`<div class="cr"><input type="checkbox" ${c.on!==0?'checked':''} style="accent-color:${c.color}" onchange="S.cal.cals[${i}].on=this.checked?1:0;save();render()"><i class="dot" style="background:${c.color}"></i><input value="${esc(c.n)}" class="cn" onchange="S.cal.cals[${i}].n=this.value;save()"><input type="color" value="${c.color}" class="cc" onchange="S.cal.cals[${i}].color=this.value;save();render()">${c.id!='c_other'?`<span style="cursor:pointer;color:#d93025" onclick="delCal(${i})">×</span>`:''}</div>`).join('')}<button class="b" style="margin-top:8px" onclick="S.cal.cals.push({id:'c'+Date.now(),n:'New calendar',color:'#039be5',on:1});save();render()">+ Add calendar</button></div>

function delEtype(i){if(S.cfg.etypes.length<=1)return toast('Need at least one type');const t=S.cfg.etypes[i];const fb=S.cfg.etypes.find((x,j)=>j!==i);S.cal.ev.forEach(e=>{if(e.etype===t.id)e.etype=fb.id});S.cfg.etypes.splice(i,1);save();render()}
function delCal(i){const c=S.cal.cals[i];S.cal.ev.forEach(e=>{if(e.cal==c.id)e.cal='c_other'});S.cal.cals.splice(i,1);save();render();if(tab=='home')drawCal()}
async function backup(){try{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mr-calendar-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);S.lastBackup=Date.now();save();toast('Backup saved');render()}catch(e){toast('Backup failed')}}
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.cal)throw 0;S=o;migrate();theme();save();render();toast('Backup restored')}catch(e){toast('Not valid')}};r.readAsText(f)}

{n:1,t:'Welcome to Mr Calendar.',b:'A calendar, a to-do list, a streak. Nothing more.'},

function title(){const x=dt(cd),y=x.getUTCFullYear(),m=x.getUTCMonth();if(cv=='year')return y;if(cv=='month')return MN[m]+' '+y;if(cv=='day')return x.getUTCDate()+' '+MN[m]+' '+y;if(cv=='week'){const p=dt(wsd(cd)),q=dt(wsd(cd)+6);return p.getUTCDate()+(p.getUTCMonth()!=q.getUTCMonth()?' '+MN[p.getUTCMonth()].slice(0,3):'')+' – '+q.getUTCDate()+' '+MN[q.getUTCMonth()].slice(0,3)+' '+q.getUTCFullYear()}return'Upcoming'}
function nav(k){const x=dt(cd),y=x.getUTCFullYear(),m=x.getUTCMonth(),dd=x.getUTCDate();if(cv=='day')cd+=k;else if(cv=='week')cd+=7*k;else if(cv=='agenda')cd+=14*k;else if(cv=='year')cd=Math.floor(Date.UTC(y+k,m,Math.min(dd,28))/864e5);else cd=Math.floor(Date.UTC(y,m+k,Math.min(dd,28))/864e5);drawCal()}

function mini(d0,big){const x=dt(d0),f=Math.floor(Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),1)/864e5),off=(wd(f)+6)%7,dim=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();let h=['M','T','W','T','F','S','S'].map(c=>`<i class="mh">${c}</i>`).join('');for(let i=0;i<off;i++)h+='<i></i>';

function vTime(){const n=cv=='week'?7:1,a=cv=='week'?wsd(cd):cd,days=Array.from({length:n},(_,i)=>a+i),all=occs(a,a+n-1).filter(o=>vis(o.ev)),gt=`grid-template-columns:48px repeat(${n},minmax(0,1fr))`;

function vMonth(){const x=dt(cd),y=x.getUTCFullYear(),m=x.getUTCMonth(),f=Math.floor(Date.UTC(y,m,1)/864e5),a=f-((wd(f)+6)%7),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),wk=Math.ceil((((wd(f)+6)%7)+dim)/7),all=occs(a,a+wk*7-1).filter(o=>vis(o.ev));

function results(){const q=cq.toLowerCase(),l=occs(D()-120,D()+365).filter(o=>vis(o.ev)&&[o.ev.t,o.ev.desc,o.ev.loc,o.ev.guests].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.s-b.s).slice(0,120);return`<div class="ag"><h2>Search results</h2>${agRows(l)||'<div class="sub">No matches.</div>'}</div>`}
function newAt(d,e,c){const m=Math.min(1380,sn15((e.clientY-c.getBoundingClientRect().top)/.8));newEv(d,m,m+60)}

else if(col){const m=sn15((e.clientY-col.getBoundingClientRect().top)/.8),g=document.createElement('div');g.className='ev';g.style.cssText='left:0;width:calc(100% - 2px);background:#1a73e8aa;pointer-events:none';col.appendChild(g);drag={mode:'cr',col,d:+col.dataset.d,m0:m,m1:m,x:e.clientX,y:e.clientY,mv:0,g};e.preventDefault()}});
